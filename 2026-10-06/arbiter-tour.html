<title>아비터 설계 시연</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a 1280x720 stage scaled to fit; the top 664px reproduce the HWD Decision Desk GUI (its own design tokens), the bottom 56px carry captions. */
:root {
  --bg: #f3f2ee; --surface: #ffffff; --surface-2: #f9f8f5; --sunken: #eeece6;
  --ink: #151a24; --ink-2: #394150; --muted: #6a7180; --line: #e2e0d8; --line-2: #cfccc2;
  --accent: #3445d1; --accent-2: #2836a8; --accent-soft: #e9ebfc; --on-accent: #fff;
  --you: #df8600; --you-ink: #8a4f00; --you-soft: #fff3de;
  --run: #0b87d0; --run-soft: #e2f2fb;
  --ok: #138a58; --ok-soft: #e1f4ea;
  --warn: #b86e00; --warn-soft: #fdf1df;
  --err: #c93a2e; --err-soft: #fcebe8;
  --rail-bg: #121726; --rail-2: #1a2034; --rail-ink: #e7eaf3; --rail-muted: #8b93a9; --rail-line: #2b3250;
  --code-kw: #3445d1; --code-ty: #0b7a6f; --code-num: #b5481c; --code-com: #6f7685; --code-sys: #9a5c00; --code-bg: #fbfaf7;
  --cap-bg: #0b0e17; --cap-ink: #f1f3f8; --cap-accent: #ffad33;
  --radius: 12px; --radius-s: 8px;
  --shadow: 0 1px 2px rgba(20, 24, 40, .06), 0 8px 24px rgba(20, 24, 40, .06);
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans: "Inter", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d111b; --surface: #151a28; --surface-2: #121725; --sunken: #0b0e17;
    --ink: #e8ebf3; --ink-2: #c3c8d6; --muted: #8b93a7; --line: #262d40; --line-2: #343c54;
    --accent: #7686ff; --accent-2: #8f9cff; --accent-soft: #1f2650; --on-accent: #0b0e1a;
    --you: #ffad33; --you-ink: #ffcf85; --you-soft: #3a2a10;
    --run: #3fb4f5; --run-soft: #10283a; --ok: #3ccf8e; --ok-soft: #0f2c21; --warn: #f0a640; --warn-soft: #33250f; --err: #ff6b5e; --err-soft: #3a1714;
    --rail-bg: #090c14; --rail-2: #111628; --rail-line: #222944;
    --code-kw: #94a2ff; --code-ty: #4fd8c6; --code-num: #ffa070; --code-com: #808aa0; --code-sys: #f2bf62; --code-bg: #10141f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d111b; --surface: #151a28; --surface-2: #121725; --sunken: #0b0e17;
  --ink: #e8ebf3; --ink-2: #c3c8d6; --muted: #8b93a7; --line: #262d40; --line-2: #343c54;
  --accent: #7686ff; --accent-2: #8f9cff; --accent-soft: #1f2650; --on-accent: #0b0e1a;
  --you: #ffad33; --you-ink: #ffcf85; --you-soft: #3a2a10;
  --run: #3fb4f5; --run-soft: #10283a; --ok: #3ccf8e; --ok-soft: #0f2c21; --warn: #f0a640; --warn-soft: #33250f; --err: #ff6b5e; --err-soft: #3a1714;
  --rail-bg: #090c14; --rail-2: #111628; --rail-line: #222944;
  --code-kw: #94a2ff; --code-ty: #4fd8c6; --code-num: #ffa070; --code-com: #808aa0; --code-sys: #f2bf62; --code-bg: #10141f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
}
body { background: var(--bg); color: var(--ink); font-family: var(--sans); margin: 0; padding-inline: 16px; padding-block: 16px; box-sizing: border-box; }
* { box-sizing: border-box; }

.rp-wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.rp-viewport { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden; border-radius: 10px; background: var(--cap-bg); box-shadow: var(--shadow); }
.rp-stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; }
.rp-screen { position: absolute; left: 0; top: 0; width: 1280px; height: 664px; overflow: hidden; background: var(--bg); color: var(--ink); font-size: 14px; }
.rp-cap { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; justify-content: center; gap: 12px; background: var(--cap-bg); color: var(--cap-ink); font: 600 20px/1.3 var(--sans); padding: 0 24px; }
.rp-cap b { color: var(--cap-accent); font-weight: 700; }
.rp-ff { position: absolute; right: 18px; top: 66px; z-index: 30; font: 800 13px/1 var(--mono); letter-spacing: .06em; color: #fff; background: rgba(11, 14, 23, .78); padding: 8px 11px; border-radius: 7px; }
.rp-cursor { position: absolute; left: 640px; top: 400px; width: 26px; height: 26px; z-index: 50; pointer-events: none; transition: left .55s cubic-bezier(.3,.7,.2,1), top .55s cubic-bezier(.3,.7,.2,1); }
.rp-cursor svg { width: 26px; height: 26px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
.rp-cursor::after { content: ""; position: absolute; left: -14px; top: -14px; width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--accent); opacity: 0; transform: scale(.4); }
.rp-cursor.click::after { animation: ripple .45s ease-out; }
@keyframes ripple { 0% { opacity: .9; transform: scale(.4); } 100% { opacity: 0; transform: scale(1.6); } }
.pressed { transform: translateY(1px) scale(.98); filter: brightness(.95); }
.rp-end { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(9, 12, 20, .72); }
.rp-end-card { display: grid; gap: 14px; justify-items: center; text-align: center; color: #fff; }
.rp-end-card .lab { font: 700 14px/1 var(--mono); letter-spacing: .1em; color: #b9c2d8; }
.rp-end-card .seal { font: 800 88px/1 var(--mono); letter-spacing: .08em; color: #3ccf8e; border: 7px solid #3ccf8e; border-radius: 18px; padding: 14px 40px; transform: rotate(-3deg); }
.rp-end-card p { margin: 0; font-size: 16px; line-height: 1.6; color: #c9d1e4; }

/* Controls (outside the stage) */
.rp-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rp-controls button { font: 600 13px/1 var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: 7px; padding: 9px 13px; cursor: pointer; }
.rp-controls button:hover { border-color: var(--accent); }
.rp-controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rp-controls select { font: 600 13px/1 var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: 7px; padding: 8px 10px; }
.rp-controls .meta { margin-left: auto; color: var(--muted); font-size: 12.5px; }
.rp-controls code { font-family: var(--mono); }

/* ───── GUI (reproduced from ui/src/styles.css) ───── */
.rp-screen h1, .rp-screen h2, .rp-screen h3, .rp-screen h4, .rp-screen p { margin: 0; }
.rp-screen h1 { font-size: 24px; line-height: 1.3; letter-spacing: -.02em; font-weight: 720; }
.rp-screen h1.long { font-size: 19px; line-height: 1.5; font-weight: 650; letter-spacing: -.01em; }
.rp-screen h2 { font-size: 15px; font-weight: 700; }
.rp-screen h3 { font-size: 14px; font-weight: 680; }
.rp-screen p { font-size: 13.5px; line-height: 1.65; }
.rp-screen button { cursor: default; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 34px; padding: 7px 14px; border-radius: var(--radius-s); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font: 600 13px/1 var(--sans); white-space: nowrap; transition: transform .08s, filter .08s, background .15s, border-color .15s; }
.rp-screen button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.rp-screen button.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.rp-screen button.large { min-height: 44px; padding: 10px 22px; font-size: 15px; }
.rp-screen kbd { font: 600 10.5px/1 var(--mono); padding: 3px 5px; border-radius: 5px; border: 1px solid var(--line-2); border-bottom-width: 2px; background: var(--surface); color: var(--muted); }
.muted { color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 650; padding: 3px 8px; border-radius: 999px; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.chip.ok, .chip.pass { background: var(--ok-soft); color: var(--ok); }
.chip.run { background: var(--run-soft); color: var(--run); }
.meter { display: block; height: 6px; border-radius: 99px; background: var(--sunken); overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--run)); border-radius: inherit; transition: width .35s; }
.spinner { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--run); animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.8); } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--glow, var(--you)) 55%, transparent); } 50% { box-shadow: 0 0 0 6px transparent; } }
@keyframes scroll { to { transform: translateX(-60px); } }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.appear { animation: fadein .3s ease-out both; }
@keyframes fadeout { to { opacity: 0; } }
@keyframes deskin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.ghost-layer { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; pointer-events: none; background: var(--bg); animation: fadeout .28s ease-in forwards; }
.enter { animation: deskin .34s cubic-bezier(.2,.7,.2,1) both; }

/* Home / intake */
.page-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 28px; border-bottom: 1px solid var(--line); background: var(--surface); }
.brand { display: inline-flex; gap: 9px; align-items: center; font-size: 15px; }
.brand b { font-weight: 800; letter-spacing: .02em; }
.brand span { color: var(--muted); font-weight: 600; }
.brand-mark { width: 26px; height: 26px; }
.brand-mark rect { fill: var(--accent); }
.brand-mark path { stroke: var(--on-accent); }
.mode-badge { font: 700 11px/1 var(--mono); letter-spacing: .05em; padding: 6px 9px; border-radius: 6px; background: var(--ok-soft); color: var(--ok); }
.intake { max-width: 860px; margin: 0 auto; padding: 22px 28px; display: grid; gap: 12px; }
.kicker { font: 700 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.lead { font-size: 14.5px; line-height: 1.65; color: var(--ink-2); }
.field { display: grid; gap: 6px; font-size: 13px; font-weight: 650; color: var(--ink-2); }
.input { border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--radius-s); padding: 9px 11px; font-size: 14px; min-height: 38px; color: var(--ink); }
.input.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.dropzone { border: 1.5px solid var(--line-2); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.dropzone.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.dropzone-head, .dropzone-foot { display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; font-size: 13px; font-weight: 650; }
.dropzone-foot { color: var(--muted); font-weight: 500; font-size: 12px; border-top: 1px solid var(--line); }
.file-button { font-size: 12px; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line-2); }
.source-input { margin: 0; font: 12.5px/1.7 var(--mono); padding: 12px 14px; height: 228px; overflow: hidden; white-space: pre-wrap; color: var(--ink); }
.source-input.empty { color: var(--muted); }
.row-end { display: flex; justify-content: flex-end; }

/* Shell */
.shell { height: 664px; display: grid; grid-template-columns: 252px minmax(0, 1fr); grid-template-rows: 54px minmax(0, 1fr); overflow: hidden; }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 14px 0 18px; background: var(--rail-bg); color: var(--rail-ink); border-bottom: 1px solid var(--rail-line); }
.topbar .brand { color: var(--rail-ink); }
.proj { background: var(--rail-2); color: var(--rail-ink); border: 1px solid var(--rail-line); border-radius: var(--radius-s); font-weight: 650; font-size: 13px; padding: 7px 10px; }
.view-switch { display: flex; gap: 2px; padding: 3px; background: var(--rail-2); border-radius: 9px; margin-left: 8px; }
.view-switch span { color: var(--rail-muted); padding: 7px 12px; font-size: 13px; font-weight: 600; border-radius: 7px; display: inline-flex; gap: 6px; align-items: center; }
.view-switch span.on { background: rgba(255, 255, 255, .12); color: #fff; }
.badge-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.badge-dot.you { background: var(--you); animation: glow 1.6s infinite; }
.badge-dot.run { background: var(--run); animation: pulse 1.2s infinite; }
.topbar-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.palette { background: var(--rail-2); border: 1px solid var(--rail-line); color: var(--rail-muted); border-radius: var(--radius-s); min-width: 210px; display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; font-size: 13px; font-weight: 600; }
.palette kbd { background: transparent; border-color: var(--rail-line); color: var(--rail-muted); }
.palette svg, .tb-icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; }
.palette > span:first-child { display: inline-flex; gap: 8px; align-items: center; }
.tb-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: var(--radius-s); color: var(--rail-muted); }
.tb-icon.on { color: #fff; background: rgba(255, 255, 255, .12); }
.shell.with-inspector { grid-template-columns: 252px minmax(0, 1fr) 300px; }
/* Inspector (ui/src/Inspector.tsx): SoT tree tab */
.inspector { min-height: 0; display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--line); }
.inspector-tabs { display: flex; align-items: center; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); }
.inspector-tabs span { color: var(--muted); padding: 8px 12px; font-size: 13px; font-weight: 600; border-bottom: 2px solid transparent; }
.inspector-tabs span.on { color: var(--ink); border-bottom-color: var(--accent); }
.inspector-tabs i { margin-left: auto; font-style: normal; color: var(--muted); font-size: 18px; padding: 0 8px; }
.stage-pills { display: flex; gap: 4px; padding: 10px 10px 6px; }
.stage-pills span { padding: 5px 10px; font: 700 11.5px var(--mono); border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line-2); color: var(--ink-2); }
.stage-pills span.closed { color: var(--ok); }
.stage-pills span.started { color: var(--you-ink); }
.stage-pills span.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tree-search { margin: 0 10px 6px; padding: 7px 10px; font-size: 13px; color: var(--muted); border: 1px solid var(--line-2); border-radius: var(--radius-s); }
.tree-meta { display: flex; justify-content: space-between; padding: 4px 12px 6px; font-size: 11.5px; color: var(--muted); }
.itree { flex: 1; min-height: 0; overflow: hidden; }
.tree-row { height: 34px; display: flex; align-items: center; gap: 6px; padding-right: 10px; font-size: 13px; border-left: 2px solid transparent; transition: background .3s; }
.tree-row.selected { background: var(--accent-soft); border-left-color: var(--accent); }
.tree-row.selected .tree-title { font-weight: 650; }
.tree-row.fresh { background: var(--you-soft); }
.twisty { width: 14px; flex: none; color: var(--muted); font-size: 10px; text-align: center; }
.tree-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--line-2); transition: background .3s; }
.status-dot.drafted { background: var(--ok); }
.status-dot.candidate { background: transparent; border: 2px solid var(--warn); }
.tree-row .tag { font: 600 11px var(--sans); background: var(--sunken); color: var(--ink-2); }
.tree-legend { display: flex; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
.tree-legend span { display: inline-flex; gap: 5px; align-items: center; }

.rail { background: var(--rail-bg); color: var(--rail-ink); display: flex; flex-direction: column; min-height: 0; overflow: hidden; border-right: 1px solid var(--rail-line); }
.rail-now { margin: 10px 12px 2px; display: grid; gap: 4px; padding: 10px 14px; border-radius: 12px; background: var(--rail-2); border: 1px solid var(--rail-line); }
.rail-now.you { border-color: var(--you); background: linear-gradient(160deg, color-mix(in srgb, var(--you) 22%, var(--rail-2)), var(--rail-2)); }
.rail-now.run { border-color: color-mix(in srgb, var(--run) 60%, var(--rail-line)); }
.rail-now-label { font: 700 10.5px/1 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--rail-muted); }
.rail-now.you .rail-now-label { color: var(--you); }
.rail-now.run .rail-now-label { color: var(--run); }
.rail-now strong { font-size: 13.5px; line-height: 1.4; }
.rail-clock { font-size: 12px; color: var(--rail-muted); }
.rail-now .meter { background: rgba(255, 255, 255, .08); }
.pipeline { list-style: none; margin: 4px 0; padding: 0 12px; }
.pipe { position: relative; }
.pipe-group { display: block; font: 700 10px/1 var(--mono); letter-spacing: .1em; color: var(--rail-muted); text-transform: uppercase; margin: 8px 0 2px 6px; opacity: .8; }
.pipe-row { display: flex; gap: 12px; align-items: center; padding: 3px 8px; min-height: 40px; border-radius: 10px; }
.pipe.viewing .pipe-row { background: rgba(255, 255, 255, .07); }
.pipe::after { content: ""; position: absolute; left: 22px; bottom: -6px; height: 14px; width: 2px; background: var(--rail-line); }
.pipe:last-child::after, .pipe.g-end::after { display: none; }
.pipe.done::after { background: var(--ok); }
.pipe-node { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 800 11px var(--mono); background: var(--rail-bg); border: 2px solid var(--rail-line); color: var(--rail-muted); z-index: 1; }
.pipe.started .pipe-node { border-color: var(--rail-muted); color: var(--rail-ink); }
.pipe.done .pipe-node { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.pipe.active .pipe-node { border-color: var(--accent); color: var(--on-accent); background: var(--accent); }
.pipe.active.run .pipe-node { background: var(--run); border-color: var(--run); --glow: var(--run); animation: glow 1.4s infinite; }
.pipe.active.you .pipe-node { background: var(--you); border-color: var(--you); animation: glow 1.6s infinite; }
.pipe-copy { display: grid; gap: 0; min-width: 0; }
.pipe-code { font: 700 10px/1 var(--mono); color: var(--rail-muted); letter-spacing: .06em; }
.pipe-copy strong { font-size: 13.5px; }
.pipe-copy small { font-size: 11.5px; color: var(--rail-muted); font-weight: 500; }
.pipe.active.you small { color: var(--you); font-weight: 650; }
.pipe.active.run small { color: var(--run); }
.rail-foot { margin-top: auto; padding: 9px 12px; display: grid; gap: 10px; border-top: 1px solid var(--rail-line); }
.segmented { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; background: var(--rail-2); border-radius: 9px; border: 1px solid var(--rail-line); }
.segmented span { color: var(--rail-muted); font-size: 12px; font-weight: 600; text-align: center; padding: 6px 4px; border-radius: 7px; }
.segmented span.on { background: rgba(255, 255, 255, .12); color: #fff; }

.desk-area { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
.banner { display: flex; gap: 10px; align-items: center; padding: 8px 18px; font-size: 13px; border-bottom: 1px solid var(--line); background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.desk-scroll { flex: 1; overflow: hidden; }
.desk-inner { max-width: 880px; margin: 0 auto; padding: 20px 30px 30px; display: grid; gap: 14px; align-content: start; }
.desk-inner.wide { max-width: 1000px; }
.desk-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.eyebrow { display: inline-flex; gap: 7px; align-items: center; font: 700 11px/1 var(--mono); letter-spacing: .07em; text-transform: uppercase; padding: 6px 9px; border-radius: 6px; background: var(--sunken); color: var(--ink-2); }
.eyebrow.you { background: var(--you-soft); color: var(--you-ink); }
.eyebrow.run { background: var(--run-soft); color: var(--run); }
.eyebrow.done { background: var(--ok-soft); color: var(--ok); }

<div class="rp-wrap">
  <div class="rp-viewport" id="viewport">
    <div class="rp-stage" id="stage">
      <div class="rp-screen" id="screen"></div>
      <div class="rp-cap" id="cap"></div>
      <div class="rp-cursor" id="cursor" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 2l14 9-6.5 1.4L15 20l-3 1.2-3.4-7.5L4 18z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
    </div>
  </div>
  <div class="rp-controls">
    <button id="play" type="button">일시정지</button>
    <button id="restart" type="button">처음부터</button>
    <button id="speed" type="button">속도 1×</button>
    <select id="chapter" aria-label="장면 이동"></select>
    <span class="meta">시연용 가상 예시 · HWD GUI 구성 재현 (일부 화면은 설명용으로 단순화)</span>
  </div>
</div>

<script>
(() => {
  const stage = document.getElementById("stage"), viewport = document.getElementById("viewport");
  const screen = document.getElementById("screen"), cap = document.getElementById("cap"), cursor = document.getElementById("cursor");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const fit = () => { stage.style.transform = `scale(${viewport.clientWidth / 1280})`; };
  new ResizeObserver(fit).observe(viewport); fit();

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pad2 = (n) => String(n).padStart(2, "0");
  const clock = (sec) => `${pad2(Math.floor(sec / 60))}:${pad2(sec % 60)}`;

  // ── playback engine ──
  let token = 0, paused = false, speed = 1;
  const STOP = Symbol("stop");
  const sleep = (ms) => { const t = token; return new Promise((res, rej) => {
    let left = ms; const iv = setInterval(() => {
      if (t !== token) { clearInterval(iv); rej(STOP); return; }
      if (!paused) left -= 40 * speed;
      if (left <= 0) { clearInterval(iv); res(); }
    }, 40); }); };
  const $ = (sel) => screen.querySelector(sel);
  const say = (html) => { cap.innerHTML = `<span class="appear">${html}</span>`; };
  const ff = (on, label = "빨리 감기") => {
    const old = screen.querySelector(".rp-ff"); if (old) old.remove();
    if (on) screen.insertAdjacentHTML("beforeend", `<div class="rp-ff">▶▶ ${label}</div>`);
  };
  function point(el) {
    const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect(), k = s.width / 1280;
    return [(r.left + r.width / 2 - s.left) / k, (r.top + r.height / 2 - s.top) / k];
  }
  async function move(sel) {
    const el = typeof sel === "string" ? $(sel) : sel; if (!el) return;
    const [x, y] = point(el);
    cursor.style.transitionDuration = `${0.55 / speed}s`;
    cursor.style.left = `${x - 4}px`; cursor.style.top = `${y - 2}px`;
    await sleep(reduce ? 50 : 620);
  }
  async function click(sel) {
    const el = typeof sel === "string" ? $(sel) : sel; if (!el) return;
    await move(el);
    cursor.classList.remove("click"); void cursor.offsetWidth; cursor.classList.add("click");
    el.classList.add("pressed"); await sleep(160); el.classList.remove("pressed");
  }
  async function type(el, text, per = 45) { for (const ch of text) { el.textContent += ch; await sleep(per); } }
  async function scrollTo(y, ms = 700) {
    const box = $(".desk-scroll"); if (!box) return;
    const from = box.scrollTop, steps = Math.max(1, Math.round(ms / 40));
    for (let i = 1; i <= steps; i++) { box.scrollTop = from + (y - from) * (i / steps); await sleep(40); }
  }

  // ── GUI pieces ──
  const STEPS = [["SRC", "원문 분석", "설계 의도 정리"], ["REQ", "요구사항", "무엇을 만드는가"], ["ARCH", "구조", "어떻게 동작하는가"], ["MOD", "모듈", "계층과 연결"], ["VER", "검증 계획", "무엇을 확인하는가"], ["RTL", "RTL 생성", "코드·컴파일"], ["SIM", "시뮬레이션", "시나리오 실행"]];
  const brand = `<span class="brand"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8"/><path d="M7 21h5V11h8v10h5" fill="none" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg><b>HWD</b><span>Decision Desk</span></span>`;
  // state: { done: n (# of steps finished), active: index, tone: "run"|"you", label, title, sub, clock, view }
  function rail(st) {
    const now = `<div class="rail-now ${st.tone}"><span class="rail-now-label">${st.tone === "run" ? "AI 작업 중" : st.tone === "you" ? "당신의 판단이 필요해요" : "다음 작업"}</span><strong>${esc(st.title)}</strong>${st.clock ? `<span class="rail-clock">${st.clock} 경과</span>` : ""}${st.progress != null ? `<span class="meter"><i style="width:${st.progress}%"></i></span>` : ""}</div>`;
    const items = STEPS.map(([code, name, detail], i) => {
      const done = i < st.done, active = i === st.active;
      const cls = ["pipe", done ? "done" : active ? "started" : "", active ? `active ${st.tone}` : "", i === 4 ? "g-end" : "", active ? "viewing" : ""].join(" ");

    say("요구사항(REQ)부터 검증(VER)까지 <b>모든 설계 기준이 연결돼</b> 있습니다");
    await sleep(2200);
    const node = (id) => screen.querySelector(`#gn g[data-id="${id}"]`);
    await click(node(G.focus[0]));
    screen.querySelectorAll("#gn g").forEach(g => { g.style.opacity = G.focus.includes(g.dataset.id) ? "1" : ".28"; g.style.transition = "opacity .3s"; });
    screen.querySelectorAll("#ge path").forEach(p => { const on = G.focus.includes(p.dataset.a) && G.focus.includes(p.dataset.b); p.setAttribute("stroke", on ? "var(--you)" : "var(--line)"); p.setAttribute("stroke-width", on ? "3" : "1"); });
    G.focus.forEach(id => node(id).querySelector("rect").setAttribute("stroke-width", "3"));
    $("#sel").innerHTML = `<span class="chip" style="background:var(--you-soft);color:var(--you-ink)">선택 · ${esc(G.selLabel)}</span>`;
    say(G.selSay);
    await sleep(3600);
    screen.insertAdjacentHTML("beforeend", `<div class="rp-end appear"><div class="rp-end-card"><span class="lab">원문 → 리스트 → 질문 → Close → EXPAND → RTL → 검증 · 복구 → 노드 수정 · 재검증 → 그래프</span><span class="seal">PASS</span>
      <p>시연용 가상 예시입니다. 화면 구성과 작업 흐름은 HWD 하네스를 따르며, 일부 화면은 설명을 위해 단순화했습니다.</p></div></div>`);
    await sleep(5000);
  }});

  // ── controls ──
  const playBtn = document.getElementById("play"), chapterSel = document.getElementById("chapter"), speedBtn = document.getElementById("speed");
  chapterSel.innerHTML = C.map((c, i) => `<option value="${i}">${c.name}</option>`).join("");
  let current = 0;
  async function playFrom(i) {
    token++; paused = false; playBtn.textContent = "일시정지";
    const mine = token;
    for (let k = i; k < C.length; k++) {
      current = k; chapterSel.value = String(k);
      try { await C[k].run(); } catch (e) { if (e === STOP) return; throw e; }
      if (mine !== token) return;
    }
    playBtn.textContent = "다시 보기"; paused = true;
  }
  playBtn.addEventListener("click", () => {
    if (playBtn.textContent === "다시 보기") { playFrom(0); return; }
    paused = !paused; playBtn.textContent = paused ? "재생" : "일시정지";
  });
  document.getElementById("restart").addEventListener("click", () => playFrom(0));
  chapterSel.addEventListener("change", () => playFrom(Number(chapterSel.value)));
  speedBtn.addEventListener("click", () => { speed = speed === 1 ? 1.5 : speed === 1.5 ? 2 : 1; speedBtn.textContent = `속도 ${speed}×`; });
  document.addEventListener("keydown", (e) => { if (e.key === " " && e.target === document.body) { e.preventDefault(); playBtn.click(); } });
  if (location.hash === "#rec") document.querySelector(".rp-controls").hidden = true;
  playFrom(0);
})();
</script>
